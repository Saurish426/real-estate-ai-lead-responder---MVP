<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Settings</title>
  <meta name="description" content="Configure agent and office settings used by AI Lead Responder.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.14), transparent 34%),
        linear-gradient(135deg, #f7fafc 0%, #edf4ff 100%);
      color: #172033;
      font-family: "Inter", Arial, sans-serif;
      line-height: 1.5;
      text-rendering: optimizeLegibility;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.45);
      outline-offset: 3px;
    }

    .page {
      display: grid;
      min-height: 100vh;
      padding: 32px 18px;
      place-items: center;
    }

    .panel {
      width: min(720px, 100%);
      border: 1px solid #dbe3ef;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(26, 35, 57, 0.13);
      padding: 30px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 15px;
      line-height: 1.5;
    }

    .link {
      color: #2563eb;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .section-title {
      grid-column: 1 / -1;
      margin-top: 8px;
      border-top: 1px solid #e2e8f0;
      color: #0f172a;
      font-size: 15px;
      font-weight: 800;
      padding-top: 18px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #172033;
      font: inherit;
      font-size: 15px;
      padding: 12px 13px;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.13);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
    }

    button {
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 12px 18px;
      transition: background 160ms ease, transform 160ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .secondary-button {
      background: #f1f5f9;
      color: #334155;
      padding: 10px 14px;
    }

    .secondary-button:hover {
      background: #e2e8f0;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .button-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #ffffff;
      border-radius: 999px;
      animation: spin 780ms linear infinite;
    }

    button.is-loading .button-spinner {
      display: inline-block;
    }

    .status {
      min-height: 22px;
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
    }

    .status.success {
      color: #027a48;
    }

    .status.error {
      color: #b42318;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 680px) {
      .panel {
        padding: 22px;
      }

      .header,
      .header-actions,
      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="header">
        <div>
          <h1>Agent Settings</h1>
          <p class="subtitle">Save the business details the AI can use when writing lead replies.</p>
        </div>
        <div class="header-actions">
          <a class="link" href="/dashboard">Dashboard</a>
          <button id="logoutButton" class="secondary-button" type="button">Logout</button>
        </div>
      </div>

      <form id="settingsForm">
        <div class="grid">
          <div class="field">
            <label for="agentName">Agent name</label>
            <input id="agentName" name="agentName" type="text" autocomplete="name">
          </div>

          <div class="field">
            <label for="businessName">Business name</label>
            <input id="businessName" name="businessName" type="text" autocomplete="organization">
          </div>

          <div class="field">
            <label for="agentEmail">Agent email</label>
            <input id="agentEmail" name="agentEmail" type="email" autocomplete="email">
          </div>

          <div class="field">
            <label for="agentPhone">Agent phone</label>
            <input id="agentPhone" name="agentPhone" type="tel" autocomplete="tel">
          </div>

          <div class="field full">
            <label for="calendarLink">Calendar link</label>
            <input id="calendarLink" name="calendarLink" type="url" placeholder="https://calendly.com/your-link">
          </div>

          <div class="field full">
            <label for="preferredReplyTone">Preferred reply tone</label>
            <select id="preferredReplyTone" name="preferredReplyTone">
              <option value="friendly and professional">Friendly and professional</option>
              <option value="warm and concise">Warm and concise</option>
              <option value="polished and helpful">Polished and helpful</option>
              <option value="casual and upbeat">Casual and upbeat</option>
            </select>
          </div>

          <div class="section-title">Office Settings</div>

          <div class="field">
            <label for="officeName">Office name</label>
            <input id="officeName" name="officeName" type="text" autocomplete="organization">
          </div>

          <div class="field">
            <label for="officeEmail">Office email</label>
            <input id="officeEmail" name="officeEmail" type="email">
          </div>

          <div class="field">
            <label for="officePhone">Office phone</label>
            <input id="officePhone" name="officePhone" type="tel">
          </div>

          <div class="field">
            <label for="brandName">Office brand name</label>
            <input id="brandName" name="brandName" type="text">
          </div>

          <div class="field">
            <label for="primaryColor">Primary brand color</label>
            <input id="primaryColor" name="primaryColor" type="text" placeholder="#2563eb" pattern="^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$" title="Use a hex color like #2563eb">
          </div>

          <div class="field">
            <label for="secondaryColor">Secondary brand color</label>
            <input id="secondaryColor" name="secondaryColor" type="text" placeholder="#0f172a" pattern="^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$" title="Use a hex color like #0f172a">
          </div>

          <div class="field full">
            <label for="logoUrl">Logo URL</label>
            <input id="logoUrl" name="logoUrl" type="url" placeholder="https://example.com/logo.png">
          </div>

          <div class="field full">
            <label for="websiteUrl">Website URL</label>
            <input id="websiteUrl" name="websiteUrl" type="url" placeholder="https://example.com">
          </div>
        </div>

        <div class="actions">
          <button id="saveButton" type="submit">
            <span class="button-label">Save Settings</span>
            <span class="button-spinner" aria-hidden="true"></span>
          </button>
          <div class="status" id="status" role="status" aria-live="polite"></div>
        </div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById("settingsForm");
    const saveButton = document.getElementById("saveButton");
    const saveButtonLabel = saveButton.querySelector(".button-label");
    const logoutButton = document.getElementById("logoutButton");
    const statusEl = document.getElementById("status");

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = type ? `status ${type}` : "status";
    }

    function setSaveLoading(isLoading) {
      saveButton.disabled = isLoading;
      saveButton.classList.toggle("is-loading", isLoading);
      saveButton.setAttribute("aria-busy", String(isLoading));
      saveButtonLabel.textContent = isLoading ? "Saving..." : "Save Settings";
    }

    async function getErrorMessage(response, fallbackMessage) {
      try {
        const data = await response.json();
        return data.error || fallbackMessage;
      } catch (error) {
        return fallbackMessage;
      }
    }

    function fillForm(settings) {
      Object.entries(settings || {}).forEach(([key, value]) => {
        const input = form.elements[key];

        if (input) {
          input.value = value || "";
        }
      });
    }

    function fillOffice(office) {
      const mappings = {
        officeName: office && office.name,
        officeEmail: office && office.officeEmail,
        officePhone: office && office.phone,
        brandName: office && office.brandName,
        logoUrl: office && office.logoUrl,
        primaryColor: office && office.primaryColor,
        secondaryColor: office && office.secondaryColor,
        websiteUrl: office && office.websiteUrl
      };

      Object.entries(mappings).forEach(([key, value]) => {
        const input = form.elements[key];

        if (input) {
          input.value = value || "";
        }
      });
    }

    function getFormData() {
      return {
        agentName: form.elements.agentName.value,
        agentEmail: form.elements.agentEmail.value,
        agentPhone: form.elements.agentPhone.value,
        businessName: form.elements.businessName.value,
        calendarLink: form.elements.calendarLink.value,
        preferredReplyTone: form.elements.preferredReplyTone.value,
        office: {
          name: form.elements.officeName.value,
          officeEmail: form.elements.officeEmail.value,
          phone: form.elements.officePhone.value,
          brandName: form.elements.brandName.value,
          logoUrl: form.elements.logoUrl.value,
          primaryColor: form.elements.primaryColor.value,
          secondaryColor: form.elements.secondaryColor.value,
          websiteUrl: form.elements.websiteUrl.value
        }
      };
    }

    async function loadSettings() {
      setStatus("Loading settings...");

      try {
        const response = await fetch("/api/settings");

        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = "/login?next=/settings";
            return;
          }

          throw new Error(await getErrorMessage(response, "Could not load settings."));
        }

        const data = await response.json();
        fillForm(data.settings);
        fillOffice(data.office);
        setStatus("");
      } catch (error) {
        setStatus(error.message || "Could not load settings.", "error");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        setStatus("Please fix the highlighted settings and try again.", "error");
        return;
      }

      setSaveLoading(true);
      setStatus("Saving settings...");

      try {
        const response = await fetch("/api/settings", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(getFormData())
        });

        if (!response.ok) {
          throw new Error(await getErrorMessage(response, "Could not save settings."));
        }

        const data = await response.json();
        fillForm(data.settings);
        fillOffice(data.office);
        setStatus("Settings saved.", "success");
      } catch (error) {
        setStatus(error.message || "Could not save settings.", "error");
      } finally {
        setSaveLoading(false);
      }
    });

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      logoutButton.textContent = "Logging out...";

      try {
        await fetch("/api/auth/logout", {
          method: "POST"
        });
      } finally {
        window.location.href = "/login";
      }
    });

    loadSettings();
  </script>
</body>
</html>
