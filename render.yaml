services:
  - type: web
    name: real-estate-ai-lead-responder
    runtime: node
    # Free works for validation. Upgrade to starter before a live demo or real traffic to avoid cold starts.
    plan: free
    buildCommand: npm ci && npm run deploy:prepare
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GMAIL_LEAD_CAPTURE_ENABLED
        value: "false"
      - key: EMAIL_PROVIDER
        value: gmail
      - key: GOOGLE_CALENDAR_ENABLED
        value: "false"
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: GOOGLE_CALENDAR_TIME_ZONE
        value: America/New_York
      - key: GOOGLE_CALENDAR_DEFAULT_EVENT_DURATION_MINUTES
        value: "30"
      - key: GOOGLE_CALENDAR_DEFAULT_EVENT_START_HOURS
        value: "24"
      - key: FOLLOW_UP_REMINDERS_ENABLED
        value: "true"
      - key: FOLLOW_UP_REMINDER_DELAY_HOURS
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CALENDAR_ACCESS_TOKEN
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
