<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AI Lead Responder</title>
  <meta name="description" content="Log in to the AI Lead Responder dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(239, 246, 255, 0.96), rgba(236, 253, 245, 0.92)),
        linear-gradient(180deg, #f8fafc, #e0f2fe);
      color: #172033;
      font-family: "Inter", Arial, sans-serif;
      line-height: 1.5;
      text-rendering: optimizeLegibility;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.45);
      outline-offset: 3px;
    }

    .page {
      display: grid;
      min-height: 100vh;
      padding: 32px 18px;
      place-items: center;
    }

    .card {
      width: min(440px, 100%);
      border: 1px solid #dbe3ef;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(26, 35, 57, 0.13);
      padding: 32px;
    }

    .eyebrow {
      color: #2563eb;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 8px;
      color: #0f172a;
      font-size: 30px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #64748b;
      font-size: 15px;
      line-height: 1.55;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
    }

    label {
      color: #334155;
      font-size: 13px;
      font-weight: 800;
    }

    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      color: #172033;
      font: inherit;
      padding: 13px 14px;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.13);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      margin-top: 4px;
      padding: 14px 16px;
      transition: background 160ms ease, transform 160ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .button-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #ffffff;
      border-radius: 999px;
      animation: spin 780ms linear infinite;
    }

    button.is-loading .button-spinner {
      display: inline-block;
    }

    .message {
      min-height: 22px;
      margin-top: 16px;
      color: #64748b;
      font-size: 14px;
      font-weight: 700;
    }

    .message.error {
      color: #b42318;
    }

    .footer {
      margin: 22px 0 0;
      color: #64748b;
      font-size: 14px;
      text-align: center;
    }

    .footer a {
      color: #2563eb;
      font-weight: 800;
      text-decoration: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="eyebrow">Secure dashboard access</div>
      <h1>Log in</h1>
      <p class="subtitle">Access your leads, settings, metrics, and agent workflow.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button id="submitButton" type="submit">
          <span class="button-label">Log in</span>
          <span class="button-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>
      <p class="footer">New here? <a href="/signup">Create an account</a></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const submitButton = document.getElementById("submitButton");
    const submitButtonLabel = submitButton.querySelector(".button-label");
    const message = document.getElementById("message");
    const nextUrl = new URLSearchParams(window.location.search).get("next") || "/dashboard";

    function setMessage(text, type) {
      message.textContent = text;
      message.className = type ? `message ${type}` : "message";
    }

    function setLoading(isLoading) {
      submitButton.disabled = isLoading;
      submitButton.classList.toggle("is-loading", isLoading);
      submitButton.setAttribute("aria-busy", String(isLoading));
      submitButtonLabel.textContent = isLoading ? "Logging in..." : "Log in";
    }

    async function getErrorMessage(response) {
      try {
        const data = await response.json();
        return data.error || "Could not log in.";
      } catch (error) {
        return "Could not log in.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setLoading(true);
      setMessage("");

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: form.elements.email.value.trim(),
            password: form.elements.password.value
          })
        });

        if (!response.ok) {
          throw new Error(await getErrorMessage(response));
        }

        window.location.href = nextUrl;
      } catch (error) {
        setMessage(error.message, "error");
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
